; ExpenseMate configuration (optional).
; Every value below is the same as the default built into the program, so you can
; delete this file or any line and the app behaves exactly the same.
; An environment variable (see expensemate_config.py) overrides anything written here.

[database]
; Relative paths are resolved against the project folder.
path = expense_mate.db

[auth]
; Number of digits in a one-time password (allowed 4-10)
otp_length = 6
; How long an OTP stays valid, in minutes (allowed 1-1440)
otp_validity_minutes = 10
; Shortest password accepted (allowed 1-128)
min_password_length = 6
